name: ALSAEQA Mobile Android

on:
  push:
    branches: [main, mobile-conversion, mobile-assets-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.4.1
  BLENDER_VERSION: 4.5.13

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Download and verify all real ALSAEQA assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 Tools/Assets/sync_real_assets.py

      - name: Inspect all release archives and nested ZIPs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 Tools/Assets/inspect_release_archives.py

      - name: Upload real asset archive inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALSAEQA-real-asset-archive-inventory
          path: |
            build/asset_inspection/release_archive_inventory.json
            build/asset_inspection/release_archive_inventory.txt
          if-no-files-found: warn

      - name: Install Blender for editable source conversion
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xz-utils ca-certificates xvfb imagemagick xdotool x11-utils
          blender_archive="/tmp/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          blender_url="https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          blender_sha_url="https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}.sha256"
          curl -L --fail --retry 3 "$blender_url" -o "$blender_archive"
          test -s "$blender_archive"
          curl -L --fail --retry 3 "$blender_sha_url" -o /tmp/blender.sha256
          expected_blender_name="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          test -s /tmp/blender.sha256
          grep -F "  ${expected_blender_name}" /tmp/blender.sha256 >/dev/null
          expected_blender_sha="$(awk -v name="$expected_blender_name" '$2 == name {print $1; exit}' /tmp/blender.sha256)"
          test -n "$expected_blender_sha"
          printf '%s  %s\n' "$expected_blender_sha" "$blender_archive" | sha256sum -c -
          sudo rm -rf /opt/blender
          sudo mkdir -p /opt/blender
          sudo tar -xJf "$blender_archive" --strip-components=1 -C /opt/blender
          sudo ln -sf /opt/blender/blender /usr/local/bin/blender
          blender --background --python-expr "import bpy, sys, numpy; print('Blender:', bpy.app.version_string); print('Python:', sys.version.split()[0]); print('NumPy:', numpy.__version__)"

      - name: Convert editable source models to mobile GLB
        run: |
          mkdir -p mobile/assets/converted
          blender --background --python Tools/Assets/blender_convert.py -- build/source_assets mobile/assets/converted

      - name: Download Godot headless
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Download Android export templates
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/android_* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Configure Godot Android export environment
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          test -d "$ANDROID_HOME"
          test -d "$JAVA_HOME"
          test -x "$(command -v keytool)"
          test -f "$HOME/.android/debug.keystore"

      - name: Validate mobile project
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path mobile --editor --quit

      - name: Visual runtime inspection with real assets
        run: |
          set -euo pipefail
          mkdir -p build/runtime_inspection
          rm -f build/runtime_inspection/runtime_*.png build/runtime_inspection/game_runtime.log build/runtime_inspection/ui_runtime_report.json

          set +e
          timeout 45s xvfb-run -a -s "-screen 0 1280x720x24" bash -lc '
            set -euo pipefail
            export ALSAEQA_CAPTURE_DIR="$GITHUB_WORKSPACE/build/runtime_inspection"
            /tmp/godot/Godot_v'"$GODOT_VERSION"'-stable_linux.x86_64 --path mobile --resolution 1280x720 --verbose > build/runtime_inspection/game_runtime.log 2>&1 &
            godot_pid=$!

            # Give the real asset bridge time to instantiate the authored hero,
            # animation driver and visible environment before the first frame.
            sleep 10
            for capture in 10 20 30; do
              target="build/runtime_inspection/runtime_${capture}s.png"
              if [ "$capture" != "10" ]; then
                sleep 10
              fi
              import -window root -crop 1280x720+0+0 "$target" 2>/dev/null || true
              if [ ! -s "$target" ]; then
                xwd -root -silent 2>/dev/null | convert xwd:- -crop 1280x720+0+0 PNG:"$target" 2>/dev/null || true
              fi
            done

            if kill -0 "$godot_pid" 2>/dev/null; then
              kill "$godot_pid" 2>/dev/null || true
              wait "$godot_pid" || true
            fi
          '
          status=$?
          set -e

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            cat build/runtime_inspection/game_runtime.log
            exit "$status"
          fi

          screenshot_count=$(find build/runtime_inspection -maxdepth 1 -type f -name 'runtime_*.png' -size +0c | wc -l)
          echo "Captured runtime viewport screenshots: $screenshot_count"
          if [ "$screenshot_count" -lt 3 ]; then
            echo "Runtime visual inspection failed to capture all three real application frames."
            cat build/runtime_inspection/game_runtime.log
            exit 1
          fi

          non_black=0
          for image in build/runtime_inspection/runtime_*.png; do
            mean="$(identify -format '%[fx:mean]' "$image" 2>/dev/null || echo 0)"
            deviation="$(identify -format '%[fx:standard_deviation]' "$image" 2>/dev/null || echo 0)"
            echo "RUNTIME_IMAGE_STATS file=$image mean=$mean deviation=$deviation"
            if awk "BEGIN {exit !(($mean > 0.005) && ($deviation > 0.01))}"; then
              non_black=$((non_black + 1))
            fi
          done
          echo "Non-black/non-flat runtime viewport screenshots: $non_black"
          if [ "$non_black" -lt 2 ]; then
            echo "Runtime frames are too dark or visually flat; the application world is not considered rendered."
            cat build/runtime_inspection/game_runtime.log
            exit 1
          fi

          if ! grep -q 'ALSAEQA hero selected:' build/runtime_inspection/game_runtime.log; then
            echo "Real hero selection was not confirmed in the runtime log."
            exit 1
          fi
          if ! grep -q 'ALSAEQA hero animation driver selected:' build/runtime_inspection/game_runtime.log; then
            echo "Authored hero animation driver was not confirmed in the runtime log."
            exit 1
          fi
          if ! grep -q 'ALSAEQA hero animation bridge | animations=' build/runtime_inspection/game_runtime.log; then
            echo "Hero animation bridge did not initialize."
            exit 1
          fi
          if ! grep -q 'ALSAEQA real asset coverage | environment:' build/runtime_inspection/game_runtime.log; then
            echo "Real environment coverage was not confirmed."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          text = Path('mobile/scenes/Main.tscn').read_text(encoding='utf-8')
          buttons = 0
          anchored_buttons = 0
          absolute_buttons = 0
          current_type = None
          has_anchor = False
          def flush():
              global buttons, anchored_buttons, absolute_buttons, current_type, has_anchor
              if current_type != 'Button':
                  return
              buttons += 1
              if has_anchor:
                  anchored_buttons += 1
              else:
                  absolute_buttons += 1
          for line in text.splitlines():
              m = re.match(r'\[node name="[^"]+" type="([^"]+)"', line)
              if m:
                  flush()
                  current_type = m.group(1)
                  has_anchor = False
                  continue
              if current_type == 'Button' and re.match(r'anchor_(left|top|right|bottom) = ', line):
                  has_anchor = True
          flush()
          report = {
              'buttons': buttons,
              'anchored_buttons': anchored_buttons,
              'absolute_buttons': absolute_buttons,
              'responsive_button_ratio': round(anchored_buttons / buttons, 3) if buttons else 0,
          }
          Path('build/runtime_inspection/ui_runtime_report.json').write_text(json.dumps(report, ensure_ascii=False), encoding='utf-8')
          PY

          cat build/runtime_inspection/ui_runtime_report.json

          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' build/runtime_inspection/game_runtime.log; then
            echo "Runtime visual inspection detected a fatal Godot error."
            exit 1
          fi

      - name: Upload runtime visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALSAEQA-runtime-visual-inspection
          path: |
            build/runtime_inspection/runtime_*.png
            build/runtime_inspection/game_runtime.log
            build/runtime_inspection/ui_runtime_report.json
          if-no-files-found: warn

      - name: Export Android APK
        run: |
          set -euo pipefail
          mkdir -p mobile/build
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path mobile --export-debug Android build/ALSAEQA.apk
          test -s mobile/build/ALSAEQA.apk

      - name: Upload mobile build and editable asset index
        uses: actions/upload-artifact@v4
        with:
          name: ALSAEQA-Mobile-with-real-assets
          path: |
            mobile/build/ALSAEQA.apk
            mobile/assets/converted/asset_inventory.json
          if-no-files-found: error
