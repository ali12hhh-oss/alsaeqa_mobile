name: Copy ALSAEQA source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy-source:
    if: ${{ !startsWith(github.event.head_commit.message, 'Sync source') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy source repository
        run: |
          rm -rf /tmp/alsaeqa-source
          git clone --depth 1 https://github.com/ali12hhh-oss/alsaeqa.git /tmp/alsaeqa-source
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/alsaeqa-source/. .
          rm -rf .git
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -b main
          git add -A
          git commit -m "Sync source from ali12hhh-oss/alsaeqa"
          git push --force origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
