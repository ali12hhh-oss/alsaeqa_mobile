name: Copy ALSAEQA project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy-project:
    if: ${{ !startsWith(github.event.head_commit.message, 'Sync source') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy source project files
        run: |
          rm -rf /tmp/alsaeqa-source
          git clone --depth 1 https://github.com/ali12hhh-oss/alsaeqa.git /tmp/alsaeqa-source
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find /tmp/alsaeqa-source -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec cp -a {} . \;
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync source from ali12hhh-oss/alsaeqa"
          git push origin main
